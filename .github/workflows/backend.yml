name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dolar-en-vivo.sln'
      - 'nuget.config'
      - '.github/workflows/backend.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dolar-en-vivo.sln

      - name: Build
        run: dotnet build dolar-en-vivo.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test dolar-en-vivo.sln --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/DolarEnVivo.API/DolarEnVivo.API.csproj -c Release -o publish

      - name: Zip
        run: |
          cd publish
          zip -r ../app.zip .
          cd ..

      - name: Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: finsight-ai-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
